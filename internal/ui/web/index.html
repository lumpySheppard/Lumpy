<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumpy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23a855f7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span>Lumpy</div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="connected">Connected <span class="count" id="count-connected"></span></button>
      <button role="tab" data-tab="logged">Logged <span class="count" id="count-logged"></span></button>
      <button role="tab" data-tab="projects">Projects <span class="count" id="count-projects"></span></button>
      <button role="tab" data-tab="offload">Offload</button>
      <button role="tab" data-tab="activity">Activity <span class="count live" id="count-jobs"></span></button>
    </nav>
    <div class="topbar-right">
      <span class="agent-pill" id="agent-pill" title=""></span>
    </div>
  </header>

  <section class="toolbar" id="toolbar">
    <div class="toolbar-title" id="toolbar-title"></div>
    <div class="seg" id="view-seg">
      <button data-view="grid" class="on">Grid</button>
      <button data-view="list">List</button>
    </div>
    <label class="select">
      <select id="sort">
        <option value="seen">Last seen</option>
        <option value="name">Name</option>
        <option value="size">Capacity</option>
        <option value="free">Free space</option>
        <option value="backup">Backup status</option>
      </select>
    </label>
    <button class="icon-btn" id="sort-dir" title="Reverse order"></button>
    <label class="select" title="What the card colours mean">
      <select id="color-by">
        <option value="project">Colour: project</option>
        <option value="drive">Colour: drive label</option>
        <option value="backup">Colour: backup state</option>
        <option value="client">Colour: client</option>
        <option value="none">Colour: none</option>
      </select>
    </label>
    <div class="pills" id="pills"></div>
    <div class="search">
      <span class="search-icon"></span>
      <input id="search" type="search" placeholder="Search drives or indexed names…" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="select-mode">Select</button>
    <button class="btn" id="export"><span class="i-export"></span>Export CSV…</button>
    <button class="icon-btn" id="refresh" title="Refresh"></button>
  </section>

  <main id="main"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
