name: EriksTV OFX

# Builds the EriksTV datamosh plugin for DaVinci Resolve on macOS (universal: Apple
# silicon + Intel), runs it through the test host, and uploads the zipped
# EriksTV.ofx.bundle as the "EriksTV-macOS" artifact.
on:
  push:
    branches: [main]
    paths:
      - "datamosh-ofx/**"
      - ".github/workflows/datamosh-ofx.yml"
  pull_request:
    paths:
      - "datamosh-ofx/**"
      - ".github/workflows/datamosh-ofx.yml"
  workflow_dispatch:

permissions:
  contents: read

# macOS runners queue for a while; a newer push supersedes older runs.
concurrency:
  group: datamosh-ofx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: datamosh-ofx
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 3
          lipo -info build/EriksTV.ofx.bundle/Contents/MacOS/EriksTV.ofx
          lipo build/EriksTV.ofx.bundle/Contents/MacOS/EriksTV.ofx -verify_arch arm64 x86_64
      - name: Test in minihost
        run: ctest --test-dir build --output-on-failure -V
      - name: Sign (ad hoc) and package
        run: |
          codesign --force --sign - --timestamp=none build/EriksTV.ofx.bundle
          codesign --verify --verbose build/EriksTV.ofx.bundle
          mkdir -p dist
          ditto -c -k --keepParent build/EriksTV.ofx.bundle dist/EriksTV.ofx.bundle.zip
          cp scripts/install-macos.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: EriksTV-macOS
          path: datamosh-ofx/dist/

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datamosh-ofx
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
